name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WEB_ARCHIVE: bobogang-web.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # VM의 guest agent가 멈춰 있어 gcloud의 메타데이터 키 등록은 쓸 수 없다. 고정 키로 접속한다
      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          for name in VM_HOST VM_SSH_USER VM_SSH_KEY VM_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $VM_HOST
            User $VM_SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - run: npm ci

      - name: Build
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CARD_IMAGE_BASE_URL: ${{ secrets.VITE_CARD_IMAGE_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # 값이 비면 ws://localhost 기본값으로 빌드돼 배포는 성공하고 서비스만 깨진다
        run: |
          for name in VITE_WS_URL VITE_API_URL VITE_CARD_IMAGE_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || { echo "::error::Secret $name is not set"; exit 1; }
          done
          npm run build
          tar -czf "$WEB_ARCHIVE" -C dist .

      - name: Upload build
        run: scp "$WEB_ARCHIVE" vm:/tmp/

      - name: Publish
        run: |
          ssh vm bash -s <<'EOF'
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work" /tmp/bobogang-web.tar.gz' EXIT
          tar -xzf /tmp/bobogang-web.tar.gz -C "$work"
          test -f "$work/index.html"
          sudo rm -rf /var/www/html/*
          sudo cp -r "$work"/. /var/www/html/
          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html
          # restart는 진행 중인 게임의 WebSocket까지 끊으므로 reload만 한다
          sudo nginx -t
          sudo systemctl reload nginx
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # 로그는 job이 끝나야 조회되므로 별도 job으로 분리한다
  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Send Telegram message
        env:
          SERVICE: 웹
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets are not set"
            exit 0
          fi

          commit=${COMMIT_MESSAGE%%$'\n'*}
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          summary="커밋: ${GITHUB_SHA::7} ${commit:-수동 실행}"

          if [ "$DEPLOY_RESULT" = "success" ]; then
            text=$(printf '✅ %s 배포 성공\n%s\n%s' "$SERVICE" "$summary" "$run_url")
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            text=$(printf '⚠️ %s 배포 취소\n%s\n%s' "$SERVICE" "$summary" "$run_url")
          else
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "deploy")' || true)
            job_id=$(jq -r '.id // empty' <<<"$job")
            failed_step=$(jq -r '[.steps[]? | select(.conclusion == "failure") | .name] | first // empty' <<<"$job")

            log=""
            for _ in 1 2 3 4; do
              [ -n "$job_id" ] || break
              log=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" 2>/dev/null || true)
              [ -z "$log" ] || break
              sleep 5
            done
            log=$(cut -d' ' -f2- <<<"$log")
            exit_code=$(grep -oE 'exit code [0-9]+' <<<"$log" | tail -n 1 | grep -oE '[0-9]+' || true)
            error_line=$(grep -n -m 1 '##\[error\]' <<<"$log" | cut -d: -f1 || true)
            detail=$(head -n "${error_line:-0}" <<<"$log" | tail -n 15 | cut -c1-200 | head -c 2800 | iconv -c -f utf-8 -t utf-8 || true)

            text=$(printf '❌ %s 배포 실패\n%s\n실패 단계: %s\n종료 코드: %s\n\n%s\n\n%s' \
              "$SERVICE" "$summary" "${failed_step:-알 수 없음}" "${exit_code:-없음}" "$detail" "$run_url")
          fi

          curl -fsS --retry 3 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            || echo "::warning::Telegram notification failed"
